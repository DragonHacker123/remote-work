[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flydrive"
version = "0.1.0"
description = "Drive a racing car with a connectome-constrained Drosophila brain model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
bridge = ["vgamepad>=0.1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
flydrive = "flydrive.cli:main"

[tool.setuptools.packages.find]
include = ["flydrive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs that take tens of seconds (deselect with -m 'not slow')",
]
